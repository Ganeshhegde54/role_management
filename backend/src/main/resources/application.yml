server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: role-management-backend
  profiles:
    active: dev

  datasource:
    url: ${DB_URL:jdbc:h2:mem:role_management_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d9e0b2a4f6c8d9e0b2a4f6c8d9e0b2a4f6c8d9e0b2a4f}
    expiration-milliseconds: ${JWT_EXPIRATION:86400000} # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
